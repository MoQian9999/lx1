<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五子棋</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>

  <!-- ========== 对局双方信息 ========== -->
  <div class="game-header">
    <!-- 对手 -->
    <div id="opponentPlayerInfo" class="player-info">
      <div id="opAvatar" class="player-avatar">?</div>
      <span id="opName" class="player-name">等待中...</span>
      <div id="opStone" class="player-stone stone-white"></div>
    </div>

    <span class="vs-text">VS</span>

    <!-- 自己 -->
    <div id="myPlayerInfo" class="player-info">
      <div id="myStone" class="player-stone stone-black"></div>
      <span id="myName" class="player-name">我</span>
      <div id="myAvatar" class="player-avatar">我</div>
    </div>
  </div>

  <!-- ========== 计时器 ========== -->
  <div id="timerDisplay">
    <span id="moveTimer">60s</span>
  </div>

  <!-- ========== 棋盘 ========== -->
  <div id="boardWrapper" class="board-wrapper">
    <canvas id="boardCanvas"></canvas>
    <!-- 等待遮罩 -->
    <div id="waitingOverlay">
      <span id="waitingText">等待对手加入...</span>
    </div>
    <!-- 悔棋请求遮罩 -->
    <div id="undoOverlay" class="hidden">
      <p class="undo-text">对手请求悔棋</p>
      <div class="undo-buttons">
        <button onclick="acceptUndo()">同意</button>
        <button onclick="rejectUndo()">拒绝</button>
      </div>
    </div>
  </div>

  <!-- ========== 底部状态与按钮 ========== -->
  <div class="game-footer">
    <span id="statusText"></span>
    <button id="btnUndo" onclick="requestUndo()">悔棋</button>
    <button id="btnNudge" onclick="nudgeOpponent()">提醒</button>
    <button id="btnSurrender" onclick="surrender()">认输</button>
    <button id="btnPlayAgain" onclick="playAgain()">再来一局</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
